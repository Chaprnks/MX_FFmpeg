name: Manual Codec Build

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Select architectures'
        required: true
        default: 'armeabi-v7a'
        type: choice
        options:
          - 'armeabi-v7a'
          - 'arm64-v8a'
          - 'x86'
          - 'x86_64'
          - 'all'
      clean_build:
        description: 'Clean build (remove old artifacts)'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.architectures == 'all' && '["armeabi-v7a","arm64-v8a","x86","x86_64"]' || format('["{0}"]', inputs.architectures)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config yasm nasm perl

      - name: Clean (optional)
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf ffmpeg/jni/build
          echo "Cleaned old builds"

      - name: Set NDK
        run: |
          mkdir -p ffmpeg/jni
          NDK_PATH="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK=${NDK_PATH}" > ffmpeg/jni/ENV
          echo "NDK=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd ffmpeg/jni
          chmod +x build-ffmpeg.sh
          ./build-ffmpeg.sh "${{ matrix.arch }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: build-manual-${{ matrix.arch }}
          path: ffmpeg/jni/build
          retention-days: 30

  release:
    needs: build
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: build-manual-*
          merge-multiple: false

      - name: Package release archives
        run: |
          mkdir -p dist
          for dir in release-assets/build-manual-*; do
            if [ -d "$dir" ]; then
              arch_name=$(basename "$dir")
              tar -czf "dist/${arch_name}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: manual-${{ github.run_number }}
          name: Manual Codec Build #${{ github.run_number }}
          files: dist/*.tar.gz
          generate_release_notes: true
