name: Build MX FFmpeg Codec

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'ffmpeg/**'
      - '.github/workflows/build-codec.yml'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to build (comma-separated: armeabi-v7a, arm64-v8a, x86, x86_64)'
        required: false
        type: string
        default: 'armeabi-v7a,arm64-v8a,x86,x86_64'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.3.13750724

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.set-archs.outputs.archs }}
    steps:
      - name: Set architectures
        id: set-archs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.architectures }}" ]; then
            RAW_ARCHS="${{ inputs.architectures }}"
          else
            RAW_ARCHS="armeabi-v7a,arm64-v8a,x86,x86_64"
          fi
          ARCHS_JSON=$(jq -nc --arg archs "$RAW_ARCHS" '$archs | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "archs=$ARCHS_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            texinfo \
            yasm \
            nasm \
            perl \
            meson \
            ninja-build \
            cmake \
            rsync \
            zip \
            unzip \
            jq \
            dos2unix

      - name: Ensure Android NDK is installed
        id: setup-ndk
        run: |
          NDK_PATH=""
          if [ -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]; then
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          fi

          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing Android NDK $NDK_VERSION..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          fi

          echo "Using NDK at: $NDK_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK=$NDK_PATH" >> "$GITHUB_ENV"
          mkdir -p ffmpeg/jni
          cat > ffmpeg/jni/ENV << EOF
          CPU_CORE="\$(nproc --all)"
          NDK=$NDK_PATH
          export CPU_CORE NDK
          EOF

      - name: Build for ${{ matrix.arch }}
        shell: bash
        run: |
          set -o pipefail
          cd ffmpeg/jni
          find . -type f \( -name "*.sh" -o -name "configure" -o -name "Configure" -o -name "bootstrap" -o -name "config.guess" -o -name "config.sub" -o -name "compile" -o -name "depcomp" -o -name "install-sh" -o -name "missing" \) -exec chmod +x {} +
          chmod +x ENV openssl-1.0.2s/util/* 2>/dev/null || true
          if ! ./rebuild-ffmpeg.sh "${{ matrix.arch }}" 2>&1 | tee "build-${{ matrix.arch }}.log"; then
            echo "Build failed for ${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: ffmpeg/jni/build/${{ matrix.arch }}
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.arch }}
          path: |
            ffmpeg/jni/build-*.log
            ffmpeg/jni/rebuild-ffmpeg.log
            ffmpeg/jni/ffmpeg/ffbuild/config.log
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: false

      - name: Prepare package
        run: |
          mkdir -p codec-release
          for dir in artifacts/build-*; do
            if [ -d "$dir" ]; then
              arch_name="${dir#artifacts/build-}"
              mkdir -p "codec-release/${arch_name}"
              find "$dir" -name "*.so" -exec cp -f {} "codec-release/${arch_name}/" \;
            fi
          done
          cp ffmpeg/README.md codec-release/README.txt || true

          cat > codec-release/BUILD_INFO.txt << EOF
          MX FFmpeg Custom Codec
          Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Git Commit: ${{ github.sha }}
          Repository: ${{ github.repository }}
          EOF

      - name: Create ZIP archive
        run: |
          cd codec-release
          zip -r "../mx-ffmpeg-codec-${{ github.run_id }}.zip" .

      - name: Generate checksum
        run: |
          sha256sum "mx-ffmpeg-codec-${{ github.run_id }}.zip" > "mx-ffmpeg-codec-${{ github.run_id }}.zip.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: mx-ffmpeg-codec-package
          path: |
            mx-ffmpeg-codec-*.zip
            mx-ffmpeg-codec-*.sha256
          retention-days: 90

  release:
    needs: [setup, package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: mx-ffmpeg-codec-package

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: MX FFmpeg Codec Build #${{ github.run_number }}
          body: |
            # MX FFmpeg Custom Codec Release

            **Build ID:** ${{ github.run_id }}
            **Commit:** ${{ github.sha }}

            ## Included Architectures
            - armeabi-v7a (ARM 32-bit NEON)
            - arm64-v8a (ARM 64-bit)
            - x86 (Intel 32-bit)
            - x86_64 (Intel 64-bit)
          files: |
            mx-ffmpeg-codec-*.zip
            mx-ffmpeg-codec-*.sha256
