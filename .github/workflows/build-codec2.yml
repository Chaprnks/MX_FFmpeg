name: Build MX FFmpeg Codec

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'ffmpeg/**'
      - '.github/workflows/build-codec.yml'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures to build (comma-separated: armeabi-v7a, arm64-v8a, x86, x86_64)'
        required: false
        type: string
        default: 'armeabi-v7a,arm64-v8a,x86,x86_64'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 21.4.7075529
  ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/21.4.7075529

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.set-archs.outputs.archs }}
    steps:
      - name: Set architectures
        id: set-archs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.architectures }}" ]; then
            RAW_ARCHS="${{ inputs.architectures }}"
          else
            RAW_ARCHS="armeabi-v7a,arm64-v8a,x86,x86_64"
          fi
          ARCHS_JSON=$(jq -nc --arg archs "$RAW_ARCHS" '$archs | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "archs=$ARCHS_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.architectures) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            texinfo \
            yasm \
            nasm \
            perl

      - name: Ensure Android NDK is installed
        run: |
          if [ ! -d "$ANDROID_NDK_ROOT" ]; then
            echo "Installing Android NDK $NDK_VERSION..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi

      - name: Set NDK environment
        run: |
          mkdir -p ffmpeg/jni
          cat > ffmpeg/jni/ENV << EOF
          NDK=$ANDROID_NDK_ROOT
          export NDK
          EOF

      - name: Build for ${{ matrix.arch }}
        shell: bash
        run: |
          set -o pipefail
          cd ffmpeg/jni
          chmod +x build-ffmpeg.sh rebuild-ffmpeg.sh
          if ! ./build-ffmpeg.sh "${{ matrix.arch }}" 2>&1 | tee "build-${{ matrix.arch }}.log"; then
            echo "Build failed for ${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.arch }}
          path: ffmpeg/jni/build
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.arch }}
          path: ffmpeg/jni/build-*.log
          retention-days: 30

  package:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: false

      - name: Prepare package
        run: |
          mkdir -p codec-release
          find artifacts -name "*.so" -exec cp {} codec-release/ \;
          cp README codec-release/README.txt || true

          cat > codec-release/BUILD_INFO.txt << EOF
          MX FFmpeg Custom Codec
          Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Git Commit: ${{ github.sha }}
          Repository: ${{ github.repository }}
          EOF

      - name: Create ZIP archive
        run: |
          cd codec-release
          zip -r "../mx-ffmpeg-codec-${{ github.run_id }}.zip" .

      - name: Generate checksum
        run: |
          sha256sum "mx-ffmpeg-codec-${{ github.run_id }}.zip" > "mx-ffmpeg-codec-${{ github.run_id }}.zip.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: mx-ffmpeg-codec-package
          path: |
            mx-ffmpeg-codec-*.zip
            mx-ffmpeg-codec-*.sha256
          retention-days: 90

  release:
    needs: [setup, package]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: mx-ffmpeg-codec-package

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: MX FFmpeg Codec Build #${{ github.run_number }}
          body: |
            # MX FFmpeg Custom Codec Release

            **Build ID:** ${{ github.run_id }}
            **Commit:** ${{ github.sha }}

            ## Included Architectures
            - armeabi-v7a (ARM 32-bit)
            - arm64-v8a (ARM 64-bit)
            - x86 (Intel 32-bit)
            - x86_64 (Intel 64-bit)
          files: |
            mx-ffmpeg-codec-*.zip
            mx-ffmpeg-codec-*.sha256
